name: Training Plane Tests

on:
  pull_request:
    paths:
      - "app/training/**"
      - "tests/test_training_plane.py"
      - "tests/test_trade_secret_engine.py"
      - "tests/test_trade_secret_backup_runner.py"
      - "requirements.txt"
      - ".github/workflows/training-plane-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run training-plane tests
        run: |
          python -m unittest tests.test_training_plane -v
          python -m unittest tests.test_trade_secret_engine -v
          python -m unittest tests.test_trade_secret_backup_runner -v

