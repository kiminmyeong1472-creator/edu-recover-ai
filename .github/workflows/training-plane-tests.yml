name: Training Plane Tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "training/**"
      - "requirements-rl.txt"
      - "requirements.txt"
      - ".github/workflows/training-plane-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt 'pytest>=8,<10' 'pytest-subtests>=0.14,<1' 'httpx>=0.27,<1' 'httpx2>=2,<3'
      - name: Install browser DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/edu-js-test-runtime" --no-audit --no-fund jsdom@26.1.0
      - name: Run platform and training regression tests
        env:
          NODE_PATH: ${{ runner.temp }}/edu-js-test-runtime/node_modules
        run: |
          python -m pytest tests -q
          node tests/test_provider_ui.js
