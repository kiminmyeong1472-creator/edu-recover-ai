name: Training Plane Tests

on:
  pull_request:
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "training/**"
      - "requirements-rl.txt"
      - "requirements.txt"
      - "requirements-aws.txt"
      - "Dockerfile.aws"
      - "Dockerfile.aws.dockerignore"
      - "deployment/aws/**"
      - ".github/workflows/training-plane-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-aws.txt 'pytest>=8,<10' 'pytest-subtests>=0.14,<1' 'httpx>=0.27,<1'
      - name: Run platform and training regression tests
        run: |
          python -m pytest tests -q
          node tests/test_provider_ui.js

  aws-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build AWS image without cloud credentials
        run: docker build -f Dockerfile.aws -t edurecover-aws-ci .
