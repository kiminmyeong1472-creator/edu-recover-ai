name: Accessibility input and playback tests
on:
  pull_request:
    paths:
      - 'app/services/accessibility_*'
      - 'app/services/braille_core.py'
      - 'app/services/sign_core.py'
      - 'tests/test_accessibility_*'
      - 'tests/test_braille_core.py'
      - 'tests/test_sign_core.py'
      - 'deployment/accessibility/**'
      - '.github/workflows/accessibility-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install bounded test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install 'fastapi>=0.115,<1' 'httpx>=0.27,<1' 'httpx2>=2,<3' 'Pillow>=12,<13' 'pytest>=8,<10'
          npm install --prefix "$RUNNER_TEMP/accessibility-js-runtime" --no-audit --no-fund jsdom@26.1.0
      - name: Test recognition states, gallery playback and owner authorization
        env:
          NODE_PATH: ${{ runner.temp }}/accessibility-js-runtime/node_modules
        run: |
          python -m pytest tests/test_braille_core.py tests/test_sign_core.py tests/test_accessibility_api.py -q
          node tests/test_accessibility_ui.js
